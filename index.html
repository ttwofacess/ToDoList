<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n-key="pageTitle">To-Do List</title>

    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Color de la barra del sistema, acorde al tema claro/oscuro -->
    <meta name="theme-color" content="#6C63FF">

    <!-- iOS -->
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ToDo">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Anti-FOUC: resuelve el tema (incluido el auto, via matchMedia) antes
         del primer pintado; el CSS no tiene media queries de color. -->
    <script>
        (function () {
            try {
                const stored = localStorage.getItem('theme') || 'auto';
                const dark = stored === 'dark' ||
                    (stored === 'auto' &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch { /* storage o matchMedia no disponibles: queda el light */ }
        })();
    </script>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/tasks.css">
    <link rel="stylesheet" href="styles/task-priority.css">
    <link rel="stylesheet" href="styles/subtasks.css">
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="stylesheet" href="styles/action-modal.css">
    <link rel="stylesheet" href="styles/edit-modal.css">
    <link rel="stylesheet" href="styles/donate-modal.css">
    <link rel="stylesheet" href="styles/filter.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/empty-state.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/toast.css">
    <script src="./assets/vendor/purify.min.js"></script>
    <script src="./js/main.js" type="module"></script>
</head>
<body>
    <main class="list roundBorder">
        <div class="date">
            <div class="dateLeft">
                <div id="dateNumber"></div>
                <div>
                    <div id="dateMonth"></div>
                    <div id="dateYear"></div>
                </div>
            </div>
            <div class="dateRight">
                <div id="dateText"></div>
                <button type="button" id="themeToggleButton" class="theme-toggle" data-i18n-label="themeToggleLabel" aria-label="Theme">
                    <svg data-theme-icon="light" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg data-theme-icon="dark" hidden aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg data-theme-icon="auto" hidden aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="new-task-button-wrapper">
            <button type="button" id="openNewTaskModal" class="newTaskMainButton roundBorder">
                <span class="plus-icon">+</span> <span data-i18n-key="newTaskButton">New Task</span>
            </button>
        </div>
        <div class="orderButton-wrapper">
            <button type="button" class="orderButton roundBorder" data-i18n-key="orderButton">Order</button>
            <button type="button" class="filterButton roundBorder" data-i18n-key="filterButtonToday">Focus Mode</button>
        </div>
        <div class="actions-wrapper">
            <button type="button" class="actionButton roundBorder" data-action="export" data-i18n-key="exportButton">Export</button>
            <button type="button" class="actionButton roundBorder" onclick="document.getElementById('importInput').click()" data-i18n-key="importButton">Import</button>
            <input type="file" id="importInput" accept=".json" style="display: none;">
            <button type="button" id="installButton" class="actionButton roundBorder" data-i18n-key="installButton" hidden>Install</button>
        </div>
        <div class="search-wrapper" role="search">
            <label for="taskSearch" class="visually-hidden" data-i18n-key="searchLabel">Search</label>
            <span class="search-icon" aria-hidden="true" focusable="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </span>
            <input type="search" id="taskSearch" class="roundBorder"
                   placeholder="Search tasks and subtasks…"
                   data-i18n-key="searchPlaceholder"
                   autocomplete="off" spellcheck="false" maxlength="100" enterkeyhint="search">
            <button type="button" id="taskSearchClear" class="search-clear" hidden>
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <p id="searchEmpty" class="search-empty" role="status" aria-live="polite"
           data-i18n-key="searchNoResults" hidden>No tasks match your search.</p>
        <p id="filterEmpty" class="search-empty" role="status" aria-live="polite"
           data-i18n-key="filterNoTasks" hidden>No tasks to show with this filter.</p>
        <div id="tasksContainer"></div>
        <div id="emptyState" class="empty-state" hidden>
            <img class="empty-state-image" src="./assets/empty-state.svg"
                 alt="" width="120" height="120">
            <p class="empty-state-title" data-i18n-key="emptyStateTitle">Your list is empty</p>
            <p class="empty-state-text" data-i18n-key="emptyStateText">Add your first task to get started.</p>
        </div>
        <div class="donate-wrapper">
            <button type="button" id="donateButton" class="roundBorder" data-i18n-key="donateButton">Donate</button>
        </div>
    </main>

    <div id="newTaskModal" class="modal">
        <div class="modal-content roundBorder">
            <span class="close-button" id="closeNewTaskModal">&times;</span>
            <h2 data-i18n-key="newTaskTitle">New Task</h2>
            <form id="newTaskForm">
                <input type="text" name="taskText" autocomplete="off" placeholder="New Task" class="roundBorder" data-i18n-key="taskPlaceholder">
                <div class="priority-wrapper">
                    <label for="taskPriority" data-i18n-key="priorityLabel">Priority:</label>
                    <select name="taskPriority" id="taskPriority" class="roundBorder">
                        <option value="high" data-i18n-key="priorityHigh">High</option>
                        <option value="medium" selected data-i18n-key="priorityMedium">Medium</option>
                        <option value="low" data-i18n-key="priorityLow">Low</option>
                    </select>
                </div>
                <div class="date-wrapper">
                    <label for="taskDate" data-i18n-key="dateLabel">Date:</label>
                    <input type="date" name="taskDate" id="taskDate" class="roundBorder" data-i18n-key="datePlaceholder" required>
                </div>
                <div class="date-wrapper time-wrapper">
                    <label for="taskTime" data-i18n-key="timeLabel">Time:</label>
                    <div class="time-input-wrapper">
                        <input type="time" name="taskTime" id="taskTime" class="roundBorder">
                        <button type="button" class="clear-time" id="clearTaskTime" data-i18n-label="clearTime" title="Clear time">&times;</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="orderButton roundBorder" data-i18n-key="addButton">Add</button>
                    <button type="button" id="cancelNewTaskButton" class="filterButton roundBorder" data-i18n-key="cancelButton">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="donateModal" class="modal">
        <div class="modal-content roundBorder">
            <span class="close-button">&times;</span>
            <h2 data-i18n-key="donateTitle">Donate</h2>
            <div class="crypto-options">
                <div class="crypto-option">
                    <div class="crypto-icon">₿</div>
                    <div class="crypto-info">
                        <span class="crypto-name">Bitcoin</span>
                        <input type="text" value="bc1qxz4nxj8rzxzsnwj8u4rq46wy8dnf5h7yvzaqs2" readonly>
                    </div>
                    <button class="copy-button" data-i18n-key="copyButton">Copy</button>
                </div>
                <div class="crypto-option">
                    <div class="crypto-icon">Ł</div>
                    <div class="crypto-info">
                        <span class="crypto-name">Litecoin</span>
                        <input type="text" value="M8snytUjZP13KVTEHA4JCbHfy31Ve2xMr4" readonly>
                    </div>
                    <button class="copy-button" data-i18n-key="copyButton">Copy</button>
                </div>
                <div class="crypto-option">
                    <div class="crypto-icon">$</div>
                    <div class="crypto-info">
                        <span class="crypto-name">USDT (TRC20)</span>
                        <input type="text" value="TYsPkPyHbWN8cPuoDA7DohwhAdXWkVbQHm" readonly>
                    </div>
                    <button class="copy-button" data-i18n-key="copyButton">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content roundBorder">
            <span class="close-button" id="closeEditModal">&times;</span>
            <h2 data-i18n-key="editTaskTitle">Edit Task</h2>
            <form id="editTaskForm">
                <input type="text" id="editTaskText" placeholder="Task text" class="roundBorder" data-i18n-key="taskPlaceholder">

                <div class="priority-wrapper">
                    <label for="editTaskPriority" data-i18n-key="priorityLabel">Priority:</label>
                    <select id="editTaskPriority" class="roundBorder">
                        <option value="high" data-i18n-key="priorityHigh">High</option>
                        <option value="medium" data-i18n-key="priorityMedium">Medium</option>
                        <option value="low" data-i18n-key="priorityLow">Low</option>
                    </select>
                </div>

                <div class="date-wrapper">
                    <label for="editTaskDate" data-i18n-key="dateLabel">Date:</label>
                    <input type="date" id="editTaskDate" class="roundBorder" required>
                </div>

                <div class="date-wrapper time-wrapper">
                    <label for="editTaskTime" data-i18n-key="timeLabel">Time:</label>
                    <div class="time-input-wrapper">
                        <input type="time" id="editTaskTime" class="roundBorder">
                        <button type="button" class="clear-time" id="clearEditTaskTime" data-i18n-label="clearTime" title="Clear time">&times;</button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="orderButton roundBorder" data-i18n-key="saveButton">Save</button>
                    <button type="button" id="cancelEditButton" class="filterButton roundBorder" data-i18n-key="cancelButton">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="taskActionModal" class="modal">
        <div class="modal-content roundBorder">
            <span class="close-button" id="closeActionModal">&times;</span>
            <h2 id="actionModalTitle" data-i18n-key="actionModalTitle">Task Actions</h2>

            <div class="task-info-preview">
                <div id="actionModalEmojis"></div>
                <div id="actionModalText"></div>
            </div>

            <div class="action-sheet">

                <!-- Grupo 1 · Acciones primarias -->
                <div class="action-group" role="group">
                    <button type="button" id="actionDone" class="action-row action-row--done">
                        <span class="action-chip" aria-hidden="true">✅</span>
                        <span class="action-text">
                            <span class="action-label" data-i18n-key="actionDone">Done/Undone</span>
                            <span class="action-desc" data-i18n-key="actionDoneDesc">Mark as completed or pending</span>
                        </span>
                    </button>
                    <button type="button" id="actionEdit" class="action-row action-row--edit">
                        <span class="action-chip" aria-hidden="true">✏️</span>
                        <span class="action-text">
                            <span class="action-label" data-i18n-key="editTaskTitle">Edit</span>
                            <span class="action-desc" data-i18n-key="actionEditDesc">Change text, date or priority</span>
                        </span>
                    </button>
                </div>

                <!-- Grupo 2 · Acciones de contenido -->
                <div class="action-group" role="group">
                    <button type="button" id="actionSubtask" class="action-row action-row--subtask">
                        <span class="action-chip" aria-hidden="true">➕</span>
                        <span class="action-text">
                            <span class="action-label" data-i18n-key="addSubtask">Subtasks</span>
                            <span class="action-desc" data-i18n-key="actionSubtaskDesc">Break it into smaller steps</span>
                        </span>
                    </button>
                    <button type="button" id="actionRecurrence" class="action-row action-row--recurrence">
                        <span class="action-chip" aria-hidden="true">🔁</span>
                        <span class="action-text">
                            <span class="action-label" data-i18n-key="repeatButtonTitle">Repeat</span>
                            <span class="action-desc" data-i18n-key="actionRecurrenceDesc">Cycle: none, daily, weekly, monthly</span>
                        </span>
                    </button>
                </div>

                <!-- Grupo 3 · Zona de peligro -->
                <div class="action-group action-group--danger" role="group">
                    <button type="button" id="actionDelete" class="action-row action-row--danger">
                        <span class="action-chip" aria-hidden="true">🗑️</span>
                        <span class="action-text">
                            <span class="action-label" data-i18n-key="deleteButton">Delete</span>
                            <span class="action-desc" data-i18n-key="actionDeleteDesc">You can undo for 5 seconds</span>
                        </span>
                    </button>
                </div>

            </div>

            <div id="actionSubtasksContainer">
                <!-- Subtasks will be moved here when modal opens -->
            </div>
        </div>
    </div>

    <div id="updateToast" class="toast" role="status" aria-live="polite" hidden>
        <span data-i18n-key="updateAvailableMessage">A new version is available.</span>
        <button type="button" id="updateReloadButton" class="actionButton roundBorder" data-i18n-key="reloadButton">Reload</button>
    </div>

    <div id="undoToast" class="toast toast--undo" role="status" aria-live="polite" hidden>
        <span id="undoToastMessage" data-i18n-key="taskDeletedMessage">Task deleted.</span>
        <button type="button" id="undoButton" class="actionButton roundBorder" data-i18n-key="undoButton">Undo</button>
        <span class="toast-progress" aria-hidden="true"></span>
    </div>
</body>
</html>
